name: CI Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same ref so pushes while CI is running
# don't pile up in the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Primary LTS. Add the next LTS to this list when it's available so
        # regressions are caught early.
        java: ['25']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for SonarCloud to analyze full history

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Validate Maven reactor
        run: ./mvnw -B -ntp validate

      - name: Build & verify with coverage
        # -Dgpg.skip=true: maven-gpg-plugin is inherited from ifrugal-parent
        # and binds to verify. CI has no GPG key configured; signing is a
        # release-time concern, not a CI concern.
        run: ./mvnw -B -ntp -U -Dgpg.skip=true clean verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-jdk${{ matrix.java }}
          path: |
            **/target/site/jacoco/
          retention-days: 14

      - name: SonarCloud analysis
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw -B -ntp sonar:sonar \
            -Dgpg.skip=true \
            -Dsonar.projectKey=iFrugal_gateway \
            -Dsonar.organization=ifrugal \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

  dependency-analyze:
    name: Dependency hygiene
    runs-on: ubuntu-latest
    needs: build
    # Don't block PR completion on this — it's a hygiene check, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Analyze declared vs. used dependencies
        # Pin to 3.9.0: earlier versions bundle an ASM that can't read
        # Java 25 bytecode (major version 69), failing with
        # "Byte code of ... is corrupt ... Unsupported class file major
        # version 69". 3.9.0 was the first release with ASM new enough
        # for JDK 25 support.
        run: ./mvnw -B -ntp -DskipTests -Dgpg.skip=true
          org.apache.maven.plugins:maven-dependency-plugin:3.9.0:analyze
