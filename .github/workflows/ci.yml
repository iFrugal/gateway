name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so pushes while CI is running
# don't pile up in the queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Primary LTS. Add the next LTS to this list when it's available so
        # regressions are caught early.
        java: ['25']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for SonarCloud to analyze full history

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Validate Maven reactor
        run: ./mvnw -B -ntp validate

      - name: Build & verify with coverage
        # -Dgpg.skip=true: maven-gpg-plugin is inherited from ifrugal-parent
        # and binds to verify. CI has no GPG key configured; signing is a
        # release-time concern, not a CI concern.
        run: ./mvnw -B -ntp -U -Dgpg.skip=true clean verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-jdk${{ matrix.java }}
          path: |
            **/target/site/jacoco/
          retention-days: 14

      - name: SonarCloud analysis
        # Only run on direct pushes to main. Feature-branch pushes and
        # PRs from forks don't analyse well in SonarCloud's free tier
        # without dedicated branch/PR analysis setup, and there is no
        # value in re-analysing the same code on every feature branch.
        #
        # `continue-on-error: true`: SonarCloud is a hygiene/observability
        # check, not a release gate. A dead or rotated SONAR_TOKEN should
        # not fail the whole build — surface it as a non-blocking signal
        # and rotate the secret out-of-band.
        #
        # The plugin is addressed by full coordinates: the `sonar` goal prefix
        # is not resolvable, because Maven only searches the default plugin
        # groups (org.apache.maven.plugins, org.codehaus.mojo) for prefixes and
        # sonar-maven-plugin lives in org.sonarsource.scanner.maven. The version
        # comes from pluginManagement in the root pom, and every sonar.* setting
        # (projectKey, organization, host URL, coverage report paths) is a
        # property there too, so nothing is duplicated here.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw -B -ntp -Dgpg.skip=true \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  dependency-analyze:
    name: Dependency hygiene
    runs-on: ubuntu-latest
    needs: build
    # Don't block PR completion on this — it's a hygiene check, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      - name: Analyze declared vs. used dependencies
        # Pin to 3.9.0: earlier versions bundle an ASM that can't read
        # Java 25 bytecode (major version 69), failing with
        # "Byte code of ... is corrupt ... Unsupported class file major
        # version 69". 3.9.0 was the first release with ASM new enough
        # for JDK 25 support.
        run: ./mvnw -B -ntp -DskipTests -Dgpg.skip=true
          org.apache.maven.plugins:maven-dependency-plugin:3.9.0:analyze
