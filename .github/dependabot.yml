# Dependabot configuration — keeps build dependencies, GitHub Actions and the
# Docker base image current so JDK / library bumps are noticed promptly rather
# than during the next manual audit.
#
# Major-version bumps for the framework stack are intentionally NOT auto-PR'd:
# they require coordinated migration (e.g. Spring Boot 4 + Spring Cloud 2025.1
# rename spring-cloud-starter-gateway, springdoc 3.x targets Spring Boot 4,
# json-schema-validator 2.x/3.x rewrote the JsonSchema/JsonSchemaFactory API).
# Bump those manually when the migration work is scoped.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maven"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      spring-cloud:
        patterns:
          - "org.springframework.cloud:*"
    ignore:
      # Spring Boot — major bumps require Spring Framework 7 / Jakarta EE 11
      # alignment and the Spring Cloud Gateway artifact rename. Manual only.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      # Spring Cloud release trains track Spring Boot majors. Same rationale.
      - dependency-name: "org.springframework.cloud:*"
        update-types: ["version-update:semver-major"]
      # springdoc 3.x targets Spring Boot 4 / Spring Framework 7. Bump in
      # lockstep with Spring Boot, not independently.
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
      # networknt json-schema-validator 2.x and 3.x reshape the JsonSchema /
      # JsonSchemaFactory / SpecVersionDetector API the RequestValidator
      # uses. Major bumps need code changes + tests in the same PR.
      - dependency-name: "com.networknt:json-schema-validator"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Hard pin to the Java 25 LTS line. Eclipse Temurin ships non-LTS
      # images (26, 27, 28) between LTS releases; reject any tag that
      # rolls us to those interim versions. The previous filter used
      # ">=3.10-eclipse-temurin-26" which Dependabot couldn't satisfy
      # against the actual proposed tag "3.9-eclipse-temurin-26-alpine"
      # (same maven version, only JDK changed) — that bump still slipped
      # through. Wildcards on the JDK-version segment fix it.
      #
      # Re-evaluate when Java 29 LTS GA arrives (Sep 2027). Bumping the
      # baseline is then its own explicit PR — same pattern as Java 25.
      - dependency-name: "maven"
        versions:
          - "*-eclipse-temurin-26*"
          - "*-eclipse-temurin-27*"
          - "*-eclipse-temurin-28*"
      - dependency-name: "eclipse-temurin"
        versions:
          - "26*"
          - "27*"
          - "28*"
      # Belt-and-suspenders: any major bump of the maven image itself
      # (e.g. maven:3.x -> maven:4.x) is a build-tool generation change,
      # not a routine patch; require manual review.
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
