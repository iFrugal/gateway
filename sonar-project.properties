# SonarCloud Configuration
# See: https://docs.sonarcloud.io/advanced-setup/ci-based-analysis/sonarscanner-for-maven/

sonar.projectKey=iFrugal_gateway
sonar.organization=ifrugal
sonar.projectName=Spring Gateway Toolkit

# Source encoding
sonar.sourceEncoding=UTF-8

# Exclude generated code and test fixtures from analysis
sonar.exclusions=**/target/**,**/node_modules/**

# Coverage report paths (JaCoCo XML)
sonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

# Java version
sonar.java.source=25
