# =============================================================================
# Custom Mock API Configurations
# =============================================================================
# Mount this file as /app/mocks/custom-mocks.yml in Docker
# =============================================================================

# Simple GET endpoint. bodyTemplate: true is what makes ${...} substitute;
# without it the placeholder is returned as literal text.
- request:
    uri: /mock/hello
    httpMethod: GET
  response:
    bodyTemplate: true
    body: |
      {
        "message": "Hello from Spring Gateway Toolkit!",
        "timestamp": "${.now?string('yyyy-MM-dd HH:mm:ss')}"
      }
    contentType: application/json
    statusCode: 200

# POST endpoint with body template.
# bodySchema is required for ${request.body...} to exist in the template
# context, and the whole body cannot be echoed as one expression (it is a
# map); the <#list> copies scalar fields.
- request:
    uri: /mock/echo
    httpMethod: POST
    validation:
      bodySchema: |
        {"$schema": "https://json-schema.org/draft/2020-12/schema", "type": "object"}
  response:
    bodyTemplate: true
    body: |
      {
        "echo": {<#list request.body?keys?filter(k -> request.body[k]?is_string || request.body[k]?is_number) as k>"${k}": "${request.body[k]}"<#sep>, </#list>},
        "method": "${request.httpMethod}",
        "uri": "${request.requestUri}"
      }
    contentType: application/json
    statusCode: 200

# Endpoint with custom headers
- request:
    uri: /mock/headers
    httpMethod: GET
  response:
    body: |
      {
        "status": "success"
      }
    contentType: application/json
    statusCode: 200
    # responseHeaders are literal — they do NOT pass through the template
    # engine, so a ${uuid1} here would be returned as literal text.
    responseHeaders:
      X-Custom-Header: "custom-value"

# Endpoint with validation
- request:
    uri: /mock/validate
    httpMethod: POST
    validation:
      bodySchema: |
        {
          "$schema": "http://json-schema.org/draft-04/schema#",
          "type": "object",
          "properties": {
            "name": { "type": "string", "minLength": 1 },
            "email": { "type": "string", "format": "email" }
          },
          "required": ["name", "email"]
        }
      headers:
        "authorization":
          required: true
          regexValidator: "Bearer .*"
  response:
    body: |
      {
        "status": "validated",
        "message": "Request passed all validations"
      }
    contentType: application/json
    statusCode: 200
